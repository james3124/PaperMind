<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="superdoc.css" />
    <style>
      :root {
        --page-width: 210mm;
        --page-height: 297mm;
      }
      html,
      body,
      #superdoc {
        background: #ffffff;
        margin: 0;
        padding: 0;
      }
      body.dark,
      body.dark #superdoc {
        background: #1f2937;
      }
      .superdoc-page {
        width: var(--page-width);
        min-height: var(--page-height);
      }
    </style>
  </head>
  <body>
    <div id="superdoc-toolbar"></div>
    <div id="superdoc"></div>
    <script src="superdoc.js"></script>
  </body>
</html>
